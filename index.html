<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>War Cove Newsroom — Live Rotation</title>
<style>
  :root{
    --bg:#05080a;
    --panel:#0a1210;
    --panel2:#0d1a16;
    --line:#1d3a30;
    --holo:#1dff9d;
    --holo-dim:#0fbf76;
    --ink:#eafff5;
    --ink-dim:#9fd8c0;
    --red:#ff4d4d;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;}
  body{
    background:
      radial-gradient(1200px 600px at 50% -10%, rgba(29,255,157,.08), transparent 60%),
      var(--bg);
    color:var(--ink);
    font-family:"Segoe UI", Arial, Helvetica, sans-serif;
    overflow:hidden;
    display:flex;
    flex-direction:column;
    height:100vh;
    height:100dvh;
  }

  /* ── Room header ─────────────────────────────── */
  header{
    display:flex;align-items:center;gap:14px;
    padding:12px 20px 10px;
    border-bottom:1px solid var(--line);
    background:linear-gradient(180deg, rgba(29,255,157,.06), transparent);
    flex:0 0 auto;
  }
  header .crest{font-size:26px;line-height:1;}
  header h1{
    font-size:clamp(20px,3.2vw,34px);
    font-weight:900;letter-spacing:.14em;
    color:var(--ink);
    text-shadow:0 0 18px rgba(29,255,157,.45);
    white-space:nowrap;
  }
  header h1 .wc{color:var(--holo);}
  header .chip{
    margin-left:auto;
    font-size:clamp(10px,1.3vw,13px);font-weight:700;letter-spacing:.18em;
    color:#04120b;background:var(--holo);
    padding:5px 12px;border-radius:999px;
    box-shadow:0 0 14px rgba(29,255,157,.5);
    white-space:nowrap;
  }
  header .sub{
    font-size:clamp(10px,1.2vw,13px);letter-spacing:.22em;color:var(--ink-dim);
    white-space:nowrap;
  }
  @media (max-width:760px){ header .sub{display:none;} }

  /* ── Room body: monitor beside the print ─────── */
  main{
    flex:1 1 auto;min-height:0;
    display:grid;
    grid-template-columns:minmax(0,7fr) minmax(0,5fr);
    gap:16px;
    padding:16px 20px 18px;
  }
  @media (max-width:760px){
    main{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);gap:10px;padding:10px 12px 12px;}
  }

  /* Monitor frame */
  .monitor{
    display:flex;flex-direction:column;min-height:0;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:14px;
    box-shadow:0 0 0 1px rgba(29,255,157,.12), 0 0 34px rgba(29,255,157,.10), inset 0 0 60px rgba(0,0,0,.55);
    overflow:hidden;
  }
  .mon-top{
    display:flex;align-items:center;gap:10px;
    padding:9px 14px;
    background:var(--panel2);
    border-bottom:1px solid var(--line);
    font-size:clamp(11px,1.4vw,14px);font-weight:700;letter-spacing:.16em;color:var(--ink-dim);
    flex:0 0 auto;
  }
  .mon-top .dot{width:9px;height:9px;border-radius:50%;background:var(--red);box-shadow:0 0 10px var(--red);animation:pulse 1.6s infinite;}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
  .mon-top .counter{margin-left:auto;color:var(--holo);letter-spacing:.2em;}
  .screen{
    flex:1 1 auto;min-height:0;
    background:#000;
    display:flex;align-items:center;justify-content:center;
  }
  .screen video{
    width:100%;height:100%;
    max-height:100%;
    object-fit:contain;
    background:#000;
    display:block;
  }
  .mon-bottom{
    display:flex;align-items:center;gap:10px;
    padding:9px 12px;
    background:var(--panel2);
    border-top:1px solid var(--line);
    flex:0 0 auto;
  }
  .now{
    flex:1 1 auto;min-width:0;
    font-size:clamp(11px,1.5vw,15px);font-weight:700;letter-spacing:.06em;color:var(--ink);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .now span{color:var(--holo);letter-spacing:.14em;font-size:.82em;margin-right:8px;}
  button{
    font:inherit;
    font-size:clamp(12px,1.5vw,15px);font-weight:700;
    color:var(--ink);
    background:#12241e;
    border:1px solid var(--holo-dim);
    border-radius:9px;
    min-height:36px;
    padding:6px 14px;
    cursor:pointer;
    white-space:nowrap;
  }
  button:hover{background:#173529;}
  button:active{transform:translateY(1px);}
  button[aria-pressed="true"]{background:var(--holo);color:#04120b;border-color:var(--holo);}

  /* The print panel */
  .print{
    display:flex;flex-direction:column;min-height:0;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:14px;
    box-shadow:0 0 0 1px rgba(29,255,157,.10), inset 0 0 60px rgba(0,0,0,.45);
    padding:18px 20px;
    overflow:hidden;
  }
  .print .kicker{
    font-size:clamp(10px,1.3vw,13px);font-weight:800;letter-spacing:.26em;color:var(--holo);
    margin-bottom:10px;
  }
  .print h2{
    font-size:clamp(22px,3.4vw,40px);
    line-height:1.12;font-weight:900;letter-spacing:.01em;
    text-wrap:balance;
  }
  .print .details{
    margin-top:14px;
    font-size:clamp(13px,1.7vw,18px);line-height:1.5;color:var(--ink-dim);
  }
  .print .adstatus{
    margin-top:auto;padding-top:14px;
    font-size:clamp(11px,1.4vw,14px);font-weight:700;letter-spacing:.1em;color:var(--ink-dim);
    border-top:1px dashed var(--line);
  }
  .print .adstatus b{color:var(--holo);}
  .dots{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;}
  .dots button{
    width:14px;height:14px;min-height:14px;padding:0;border-radius:50%;
    background:transparent;border:2px solid var(--holo-dim);
  }
  .dots button.on{background:var(--holo);border-color:var(--holo);box-shadow:0 0 10px rgba(29,255,157,.7);}
  .fade{animation:fadein .45s ease both;}
  @keyframes fadein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion: reduce){
    .fade{animation:none}
    .mon-top .dot{animation:none}
  }
</style>
</head>
<body>

<header>
  <div class="crest">👑</div>
  <h1><span class="wc">WAR COVE</span> NEWSROOM</h1>
  <div class="sub">MATCHED PAIRS — PRINT + AD</div>
  <div class="chip">ROTATION LIVE</div>
</header>

<main>
  <!-- The big monitor -->
  <section class="monitor" aria-label="Newsroom monitor">
    <div class="mon-top">
      <div class="dot"></div>
      <div>WAR COVE NEWS — MONITOR</div>
      <div class="counter" id="counter">STORY 1 / 9</div>
    </div>
    <div class="screen">
      <video id="ad" playsinline muted preload="auto"></video>
    </div>
    <div class="mon-bottom">
      <div class="now"><span>NOW SHOWING</span><span id="nowTitle" style="color:var(--ink);letter-spacing:.02em;font-size:1em;margin:0;"></span></div>
      <button id="prevBtn" type="button" title="Previous story">⏮ Prev</button>
      <button id="volBtn" type="button" aria-pressed="false" title="Turn the monitor sound on or off">🔇 Sound off</button>
      <button id="nextBtn" type="button" title="Next story">Next ⏭</button>
    </div>
  </section>

  <!-- The print -->
  <aside class="print" aria-label="The print — current headline">
    <div class="kicker">📰 THE PRINT — WAR COVE NEWS</div>
    <h2 id="headline"></h2>
    <p class="details" id="details"></p>
    <div class="adstatus" id="adStatus"></div>
    <div class="dots" id="dots"></div>
  </aside>
</main>

<script>
// The War Cove Newsroom rotation — matched headline ↔ ad pairs, in rotation
// order. The first nine pairs mirror the Day Brief room's monitor (read off
// the room's own getNewsPairs, Nov 15, 2026); the eight Margex poster pairs
// after them were added to this standalone page on the Warlord's direct
// order, Nov 16, 2026. Print and ad advance together: the pair rotates when
// its ad ends.
const PAIRS = [
  { headline: "Binance Been Hacked",
    details: "The first War Cove Crypto News Alert: the best thing for you to do is store your own crypto on your own cold wallet.",
    adTitle: "Binance Cold Wallet",
    ad: "ads/news-ad-binance-coldwallet.mp4" },
  { headline: "Jensen Huang's GTC Berlin Keynote",
    details: "",
    adTitle: "Jensen Huang — GTC",
    ad: "ads/news-ad-jensen-gtc.mp4" },
  { headline: "Elon Musk — Boost",
    details: "",
    adTitle: "Elon / Boost",
    ad: "ads/news-ad-elon-boost.mp4" },
  { headline: "SpaceX Picked Qualcomm — Starlink's 5G Network Is Coming",
    details: "",
    adTitle: "SpaceX × Qualcomm — Starlink 5G",
    ad: "ads/news-ad-spacex-qualcomm.mp4" },
  { headline: "Elon & Palantir — The Golden Dome",
    details: "",
    adTitle: "Elon & Palantir — The Golden Dome",
    ad: "ads/news-ad-elon-palantir.mp4" },
  { headline: "DeepSeek Agents",
    details: "",
    adTitle: "DeepSeek Agents",
    ad: "ads/news-ad-deepseek-agents.mp4" },
  { headline: "SpaceX Contracts",
    details: "",
    adTitle: "SpaceX Contracts",
    ad: "ads/news-ad-spacex-contracts.mp4" },
  { headline: "NVIDIA CEO Update",
    details: "The resignation, confirmed by NVIDIA's own 8-K filing — the allegations run as reports, never findings.",
    adTitle: "NVIDIA CEO Update",
    ad: "ads/news-ad-nvidia-ceo.mp4" },
  { headline: "War Cove Paper Game — The Official Promo",
    details: "The official dramatic promo for the War Cove Paper Game: Sheity presents the game, its board living inside the stream's own screens. The cut the Warlord approved on Nov 13, 2026 — it rides this rotation as a promo, not a news story.",
    adTitle: "Paper Game Promo — Dramatic (Sheity)",
    ad: "ads/news-promo-paper-game-dramatic.mp4" },
  { headline: "Witching Hour Trade — LTC Short +173.49%",
    details: "The Witching Hour trade, off his Margex poster: Sell 100x LTCUSD, open $51.30, marked $50.41 — +173.49%.",
    adTitle: "Margex — Witching Hour Short +173.49%",
    ad: "ads/news-ad-margex-witching-hour-short-173.mp4" },
  { headline: "Long the Bottom — LTC +521.7%",
    details: "Off his Margex poster: Buy 100x LTCUSD, open $49.07, marked $51.63 — +521.7%.",
    adTitle: "Margex — Long the Bottom +521.7%",
    ad: "ads/news-ad-margex-long-bottom-521.mp4" },
  { headline: "The Dump — LTC Short +350.1%",
    details: "Off his Margex poster: Sell 100x LTCUSD, open $49.70, marked $47.96 — +350.1%.",
    adTitle: "Margex — The Dump +350.1%",
    ad: "ads/news-ad-margex-the-dump-350.mp4" },
  { headline: "Bottom Long — LTC +203.87%",
    details: "Off his Margex poster: Buy 100x LTCUSD, open $47.58, marked $48.55 — +203.87%.",
    adTitle: "Margex — Bottom Long +203.87%",
    ad: "ads/news-ad-margex-bottom-long-203.mp4" },
  { headline: "Bottom Long — The Updated Trade +401.43%",
    details: "The updated trade, off his Margex poster: Buy 100x LTCUSD, open $47.58, marked $49.49 — +401.43%.",
    adTitle: "Margex — Bottom Long +401.43%",
    ad: "ads/news-ad-margex-bottom-long-401.mp4" },
  { headline: "Top of the AM Pump — Short +205.65%",
    details: "His mark: the top of the AM pump. Off his Margex poster: Sell 100x LTCUSD, open $49.60, marked $48.58 — +205.65%.",
    adTitle: "Margex — AM Pump Top Short +205.65%",
    ad: "ads/news-ad-margex-am-pump-short-205.mp4" },
  { headline: "Started From the Bottom — Now We Here +425.43%",
    details: "His line: 'Started from the bottom now we here.' Off his Margex poster: Buy 100x LTCUSD, open $43.25, marked $45.09 — +425.43%.",
    adTitle: "Margex — Bottom Long +425.43%",
    ad: "ads/news-ad-margex-bottom-long-425.mp4" },
  { headline: "Witching Hour Bottom Long — +267.14%",
    details: "Off his Margex poster: Buy 100x LTCUSD, open $48.29, marked $49.58 — +267.14%.",
    adTitle: "Margex — Witching Hour Bottom Long +267.14%",
    ad: "ads/news-ad-margex-witching-hour-bottom-long-267.mp4" }
];

const video    = document.getElementById('ad');
const headline = document.getElementById('headline');
const details  = document.getElementById('details');
const adStatus = document.getElementById('adStatus');
const nowTitle = document.getElementById('nowTitle');
const counter  = document.getElementById('counter');
const dotsBox  = document.getElementById('dots');
const volBtn   = document.getElementById('volBtn');

let idx = 0;
let soundOn = false;          // the room's law: ads START muted; one tap turns sound on
let retried = false;          // one reload on the spot before a failed ad is skipped
const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

PAIRS.forEach((_, i) => {
  const b = document.createElement('button');
  b.type = 'button';
  b.title = 'Story ' + (i + 1);
  b.addEventListener('click', () => show(i));
  dotsBox.appendChild(b);
});

function show(i){
  idx = ((i % PAIRS.length) + PAIRS.length) % PAIRS.length;
  retried = false;
  const p = PAIRS[idx];

  headline.textContent = p.headline;
  headline.classList.remove('fade'); void headline.offsetWidth; headline.classList.add('fade');
  details.textContent = p.details || '';
  details.style.display = p.details ? '' : 'none';
  adStatus.innerHTML = 'AD ON THE MONITOR — <b>' + p.adTitle + '</b>';
  nowTitle.textContent = p.adTitle;
  counter.textContent = 'STORY ' + (idx + 1) + ' / ' + PAIRS.length;
  [...dotsBox.children].forEach((d, j) => d.classList.toggle('on', j === idx));

  video.muted = !soundOn;
  video.src = p.ad;
  video.load();
  const kick = video.play();
  if (kick) kick.catch(() => {});
}

video.addEventListener('ended', () => show(idx + 1));
video.addEventListener('canplay', () => { const k = video.play(); if (k) k.catch(() => {}); });
video.addEventListener('error', () => {
  if (!retried){ retried = true; video.load(); const k = video.play(); if (k) k.catch(() => {}); }
  else { show(idx + 1); }
}, true);

// The keeper — the room's house pattern: while an ad is up, check every 1.5 s
// and restart it whenever it is found paused, so the monitor never sits still.
if (!reduced){
  setInterval(() => {
    if (video.src && video.paused && !video.ended && video.readyState > 2){
      const k = video.play(); if (k) k.catch(() => {});
    }
  }, 1500);
} else {
  video.setAttribute('controls', '');
}

volBtn.addEventListener('click', () => {
  soundOn = !soundOn;
  video.muted = !soundOn;
  volBtn.textContent = soundOn ? '🔊 Sound on' : '🔇 Sound off';
  volBtn.setAttribute('aria-pressed', String(soundOn));
  if (soundOn){ const k = video.play(); if (k) k.catch(() => {}); }
});
document.getElementById('prevBtn').addEventListener('click', () => show(idx - 1));
document.getElementById('nextBtn').addEventListener('click', () => show(idx + 1));

show(0);
</script>
</body>
</html>
